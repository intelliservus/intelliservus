openapi: 3.1.0
info:
  title: AI 客服 SaaS API
  version: 0.1.0
  description: |
    控制台契约基线。仅登记已确定形态的端点；其余模块的端点随各自垂直切片补全。
    响应统一使用 data/meta 信封，错误统一使用 error 结构（事实源 §12.1）。
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: 健康检查
      responses:
        '200':
          description: 服务可用
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok]
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
  /auth/login:
    post:
      operationId: login
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，refresh token 通过 httpOnly Cookie 下发
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/AccessToken'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      operationId: refresh
      summary: 用 httpOnly Cookie 换取新的 access token
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/AccessToken'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      operationId: logout
      summary: 登出并清除 refresh Cookie
      responses:
        '204':
          description: 已登出
  /auth/me:
    get:
      operationId: getCurrentSession
      summary: 当前登录主体与权限点
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前主体
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                  meta:
                    $ref: '#/components/schemas/ApiMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未认证或凭证失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ApiMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    ApiError:
      type: object
      required: [code, message, retryable, trace_id]
      properties:
        code:
          type: string
          description: 事实源 §12.2 定义的错误码
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
        trace_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AccessToken:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: 秒
    Session:
      type: object
      required: [user, permissions]
      properties:
        user:
          type: object
          required: [id, display_name]
          properties:
            id:
              type: string
            display_name:
              type: string
        permissions:
          type: array
          items:
            type: string
